server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: tells browsers to always use HTTPS for 1 year (enable once TLS is live)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── SPA fallback — serve index.html for all unknown paths ────────────────
    # This allows React Router (and plain in-app navigation) to work correctly
    # when the user refreshes the browser on any route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets aggressively (JS/CSS have content hashes) ────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Disable access log for health-check style pings ──────────────────────
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
